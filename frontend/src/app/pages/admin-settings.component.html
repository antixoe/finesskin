<div class="admin-page">
  <header class="admin-page__header">
    <div>
      <p class="admin-page__eyebrow">Platform configuration</p>
      <h1 class="admin-page__title">Settings</h1>
      <p class="admin-page__subtitle">
        Control how the Finesskin platform presents itself and behaves.
      </p>
    </div>
  </header>

  <section class="admin-panel" *ngIf="!loading()">
    <form class="admin-form" (submit)="save(); $event.preventDefault()">
      <div class="admin-form__field">
        <label for="setting-name">Platform name</label>
        <input id="setting-name" type="text" [(ngModel)]="settings.platformName" name="platformName" />
      </div>
      <div class="admin-form__field">
        <label for="setting-tagline">Tagline</label>
        <input id="setting-tagline" type="text" [(ngModel)]="settings.platformTagline" name="platformTagline" />
      </div>
      <div class="admin-form__field">
        <label for="setting-email">Support email</label>
        <input id="setting-email" type="email" [(ngModel)]="settings.supportEmail" name="supportEmail" />
      </div>

      <div class="admin-form__field admin-form__checkbox">
        <label for="setting-signups">Allow new sign-ups</label>
        <input id="setting-signups" type="checkbox" [(ngModel)]="settings.allowSignups" name="allowSignups" />
      </div>
      <div class="admin-form__field admin-form__checkbox">
        <label for="setting-maintenance">Maintenance mode</label>
        <input id="setting-maintenance" type="checkbox" [(ngModel)]="settings.maintenanceMode" name="maintenanceMode" />
      </div>

      <div class="admin-form__actions">
        <button type="submit" class="admin-btn admin-btn--primary" [disabled]="saving()">
          {{ saving() ? 'Saving...' : 'Save settings' }}
        </button>
      </div>
      <p class="admin-form__error" *ngIf="formError()">{{ formError() }}</p>
    </form>
  </section>

  <p class="admin-loading" *ngIf="loading()">Loading settings…</p>
</div>
