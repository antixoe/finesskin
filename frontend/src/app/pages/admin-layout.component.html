<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__brand">
      <span class="admin-sidebar__logo">F</span>
      <div>
        <div class="admin-sidebar__title">Finesskin</div>
        <div class="admin-sidebar__sub">Admin console</div>
      </div>
    </div>

    <nav class="admin-sidebar__nav">
      <a
        routerLink="/dashboard"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="admin-sidebar__icon" aria-hidden="true">◈</span>
        Overview
      </a>
      <a routerLink="/dashboard/users" routerLinkActive="is-active">
        <span class="admin-sidebar__icon" aria-hidden="true">👥</span>
        Users
      </a>
      <a routerLink="/dashboard/products" routerLinkActive="is-active">
        <span class="admin-sidebar__icon" aria-hidden="true">🧴</span>
        Products
      </a>
      <a routerLink="/dashboard/routines" routerLinkActive="is-active">
        <span class="admin-sidebar__icon" aria-hidden="true">📋</span>
        Routines
      </a>
      <a routerLink="/dashboard/scans" routerLinkActive="is-active">
        <span class="admin-sidebar__icon" aria-hidden="true">📷</span>
        Scans
      </a>
      <a routerLink="/dashboard/settings" routerLinkActive="is-active">
        <span class="admin-sidebar__icon" aria-hidden="true">⚙️</span>
        Settings
      </a>
    </nav>

    <div class="admin-sidebar__footer">
      <div class="admin-sidebar__account">
        <div class="admin-sidebar__name">{{ authService.user()?.name }}</div>
        <div class="admin-sidebar__role">Administrator</div>
      </div>
      <button type="button" class="admin-sidebar__logout" (click)="signOut()">
        Sign out
      </button>
    </div>
  </aside>

  <main class="admin-content">
    <router-outlet />
  </main>
</div>
