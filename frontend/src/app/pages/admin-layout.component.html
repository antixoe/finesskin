<div class="admin-shell">
  <header class="admin-topbar">
    <a routerLink="/dashboard" class="admin-topbar__brand">
      <span class="admin-topbar__logo">F</span>
      <span>
        <span class="admin-topbar__title">Finesskin</span>
        <span class="admin-topbar__sub">Admin console</span>
      </span>
    </a>

    <nav class="admin-topbar__nav" aria-label="Admin navigation">
      <a
        *ngIf="authService.hasPermission('DASHBOARD')"
        routerLink="/dashboard"
        data-tooltip="Overview"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="admin-icon admin-icon--overview" aria-hidden="true"></span><span class="admin-nav-text">Overview</span>
      </a>
      <a *ngIf="authService.hasPermission('USERS')" data-tooltip="Users" routerLink="/dashboard/users" routerLinkActive="is-active">
        <span class="admin-icon admin-icon--users" aria-hidden="true"></span><span class="admin-nav-text">Users</span>
      </a>
      <a *ngIf="authService.hasPermission('ROLES')" data-tooltip="Roles" routerLink="/dashboard/roles" routerLinkActive="is-active">
        <span class="admin-icon admin-icon--roles" aria-hidden="true"></span><span class="admin-nav-text">Roles</span>
      </a>
      <a *ngIf="authService.hasPermission('ROUTINES')" data-tooltip="Routines" routerLink="/dashboard/routines" routerLinkActive="is-active">
        <i class="bi bi-calendar2-week-fill" aria-hidden="true"></i><span class="admin-nav-text">Routines</span>
      </a>
      <a *ngIf="authService.hasPermission('SCANS')" data-tooltip="Scans" routerLink="/dashboard/scans" routerLinkActive="is-active">
        <i class="bi bi-camera-fill" aria-hidden="true"></i><span class="admin-nav-text">Scans</span>
      </a>
      <a *ngIf="authService.hasPermission('SETTINGS')" data-tooltip="Settings" routerLink="/dashboard/settings" routerLinkActive="is-active">
        <i class="bi bi-gear-fill" aria-hidden="true"></i><span class="admin-nav-text">Settings</span>
      </a>
    </nav>

    <div class="admin-topbar__account">
      <span>
        <span class="admin-topbar__name">{{ authService.user()?.name }}</span>
        <span class="admin-topbar__role">
          {{ authService.isSuperAdmin() ? 'Super Admin' : 'Administrator' }}
        </span>
      </span>
    </div>
  </header>

  <main class="admin-content">
    <router-outlet />
  </main>
</div>
